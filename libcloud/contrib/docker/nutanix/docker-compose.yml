services:
  nutanix-driver-test:
    build:
      context: ../../..
      dockerfile: contrib/docker/nutanix/Dockerfile
    image: libcloud-nutanix-test:latest
    working_dir: /libcloud
    environment:
      - RUNNING_IN_DOCKER=1
      - NUTANIX_EMULATOR_HOST=${NUTANIX_EMULATOR_HOST:-host.docker.internal}
      - NUTANIX_EMULATOR_PORT=${NUTANIX_EMULATOR_PORT:-9440}
      - NUTANIX_EMULATOR_USER=${NUTANIX_EMULATOR_USER:-admin}
      - NUTANIX_EMULATOR_PASSWORD=${NUTANIX_EMULATOR_PASSWORD:-password}
      - NUTANIX_INTEGRATION_TESTS=${NUTANIX_INTEGRATION_TESTS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../..:/libcloud
