services:
  api:
    build:
      context: ..
      dockerfile: libcloud.rest/Dockerfile
    image: libcloud-rest-api:latest
    container_name: libcloud-rest-api
    restart: unless-stopped
    networks:
      - libcloud_net
    env_file:
      - .env
    environment:
      # Nutanix provider — set in root .env; defaults target the Docker host
      # where the Prism emulator (or a real CVM) is reachable on 9440.
      NUTANIX_HOST: ${NUTANIX_HOST:-host.docker.internal}
      NUTANIX_PORT: ${NUTANIX_PORT:-9440}
      NUTANIX_API_VERSION: ${NUTANIX_API_VERSION:-v4.0}
      NUTANIX_VERIFY_SSL: ${NUTANIX_VERIFY_SSL:-false}
      USERS_FILE: data/users.json
      # Dex/OpenFGA/Vault are sibling compose projects on the shared libcloud_net
      # network — reach them by container-name DNS. OIDC_ISSUER_URL stays
      # http://localhost:5556/dex (matching Dex's issuer claim) and is read from
      # .env; only the JWKS/FGA/Vault endpoints use the internal container names.
      OIDC_ISSUER_URL: http://dex:5556/dex
      OIDC_JWKS_URL: http://dex:5556/dex/keys
      FGA_API_URL: http://openfga:8080
      VAULT_ADDR: http://vault:8200
      # VAULT_TOKEN is read from .env (synced from ../vault/generated/vault.env
      # by ../openfga_postgres/setup.sh). VAULT_KV_MOUNT / VAULT_KV_PREFIX come from .env when set.
    ports:
      - "127.0.0.1:${API_PORT:-8765}:8765"
    extra_hosts:
      # Keep host.docker.internal for the Nutanix lab backend (NUTANIX_HOST).
      - "host.docker.internal:host-gateway"
    volumes:
      # Live-reload config (NUTANIX_* + PUBLIC_HOSTNAME) — mounted for parity
      # with identity_service. NOTE: libcloud.rest's Settings does not read this
      # file (its NUTANIX_HOST is only a fallback; the actual host arrives via
      # the X-Provider-Connection header), so the mount alone is inert.
      - ../my.env:/run/config/my.env:ro
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  libcloud_net:
    external: true

volumes:
  api-data:
