services:
  openfga-visualizer:
    build: .
    image: openfga-rbac-visualizer
    container_name: openfga-visualizer
    # Host networking: the app reaches OpenFGA (localhost:8080) and Dex
    # exactly like the bare-metal `python3 app.py`, and the OAuth callback
    # stays http://localhost:5050/callback as registered in dex/config.yaml.
    network_mode: host
    environment:
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://localhost:8080}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-01KXFQ6JWFD2MZKFDFSHYNNNXE}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-01KXWWZY8424AMK2B443FH7TQ0}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://login.quest4science.xyz:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-libcloud-rest}
      DEX_CONFIG: /app/dex-config.yaml
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@libcloud.local}
      # Strongest gate: exact Dex `sub` of the LLDAP superadmin (copy it from
      # the "login denied" warning in the container logs after one attempt).
      # SUPERADMIN_SUB: ""
      PORT: "5050"
    volumes:
      # Read-only mount so the container can read the OAuth client secret
      # (override with OIDC_CLIENT_SECRET instead if preferred).
      - ../dex/config.yaml:/app/dex-config.yaml:ro
    restart: unless-stopped

    # Bridge-network alternative (no host networking):
    #   remove `network_mode: host` above, then uncomment:
    # ports:
    #   - "5050:5050"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # and set OPENFGA_API_URL=http://host.docker.internal:8080
