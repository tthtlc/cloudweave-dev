services:
  openfga-visualizer:
    build: .
    image: openfga-rbac-visualizer
    container_name: openfga-visualizer
    networks:
      - libcloud_net
    ports:
      - "0.0.0.0:5050:5050"
    environment:
      OPENFGA_API_URL: ${OPENFGA_API_URL:-http://openfga:8080}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-01KXFQ6JWFD2MZKFDFSHYNNNXE}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:-01KXWWZY8424AMK2B443FH7TQ0}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      # OIDC_ISSUER must match Dex's actual issuer (used for JWT validation
      # and server-side token/JWKS calls). Browser redirects use DEX_BROWSER_URL.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://dex:5556/dex}
      # Browser-facing Dex URL — redirects go through the portal's nginx proxy
      # on port 3000 so the browser never talks to port 5556 directly.
      DEX_BROWSER_URL: ${DEX_BROWSER_URL:-http://${PUBLIC_HOSTNAME:-localhost}:3000/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-libcloud-rest}
      DEX_CONFIG: /app/dex-config.yaml
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@libcloud.local}
      # Strongest gate: exact Dex `sub` of the LLDAP superadmin (copy it from
      # the "login denied" warning in the container logs after one attempt).
      # SUPERADMIN_SUB: ""
      PORT: "5050"
    volumes:
      # Read-only mount so the container can read the OAuth client secret
      # (override with OIDC_CLIENT_SECRET instead if preferred).
      - ../dex/config.yaml:/app/dex-config.yaml:ro
    restart: unless-stopped

networks:
  libcloud_net:
    external: true
