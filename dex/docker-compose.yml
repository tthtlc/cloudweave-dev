# Dex OIDC issuer — standalone compose project.
#
# Dex is config-driven (in-memory storage); the rendered config.yaml lives in
# this directory and is produced by ../openfga_my/dex_bootstrap.py (run by
# ../openfga_my/setup.sh before this service starts). The OAuth client secret
# and OIDC discovery URLs are written to ../openfga_my/generated/dex.env... no —
# dex.env is written to ../dex/generated/dex.env (self-contained).
#
# All services (openfga, dex, vault, libcloud-rest-api) share the external
# `libcloud_net` network so containers resolve each other by name across
# compose projects. Host-side provisioning scripts reach Dex via the published
# port (http://localhost:5556).
services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: dex
    restart: unless-stopped
    networks:
      - libcloud_net
    ports:
      - "${DEX_HTTP_PORT:-5556}:5556"
    volumes:
      - ./config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  libcloud_net:
    external: true
