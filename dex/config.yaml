# Dex OIDC issuer — users live in LLDAP (../lldap), reached over LDAP.
#
# Rendered to config.yaml by dex_bootstrap.py (OAuth client secret + LLDAP bind
# credentials injected). Dex authenticates users against LLDAP via the LDAP
# connector; no staticPasswords / enablePasswordDB here.
#
# The connector maps:
#   idAttr  = uid   -> OIDC token `sub`            (e.g. "cloud-admin")
#   emailAttr = mail -> OIDC token `email`         (e.g. cloud-admin@libcloud.local)
#   nameAttr = cn   -> OIDC token `name`
# so the libcloud REST API's principal_map (by_email / by_sub) resolves the
# same stable principals (cloud-admin / cloud-readonly / cloud-denied) as before.
#
# LLDAP is on the shared libcloud_net network, so Dex reaches it at
# ldap://lldap:3890. InsecureNoSSL is fine for the single-host dev network;
# for production, enable LDAPS (startTLS or ssl) and a valid CA.
#
# Optional phase-2 federation (Google + GitHub) for the role portal
# (../server) is appended by dex_bootstrap.py when DEX_GOOGLE_CLIENT_ID /
# DEX_GITHUB_CLIENT_ID are set. The LDAP connector below stays the primary
# directory for the libcloud REST API + OpenFGA; Google/GitHub are additional
# upstream connectors used only by the portal's login buttons. The portal
# OAuth client (libcloud-portal) is likewise appended when
# DEX_PORTAL_REDIRECT_URI is set.

issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

logger:
  level: info
  format: json

oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]
  grantTypes: ["authorization_code", "refresh_token"]

staticClients:
  - id: libcloud-rest
    name: libcloud REST API
    secret: ZFKxci25rQX2d7vaug2wq1fTscI3n6j0Qtw3WAni-5c
    redirectURIs:
      # Runtime portal-login callback — the browser lands here after Dex
      # authorization; identity-service (identity_service/docker-compose.yml)
      # publishes :8766 and serves /oauth/callback. Keep this one on 8766.
      - http://127.0.0.1:8766/oauth/callback
      # libcloud-rest-api itself (port 8765) — legacy/alternate callback.
      - http://localhost:8765/oauth/callback
      # Bootstrap + host-script callback (test_script/scripts/idp_login.py,
      # used by superadmin_auth.sh during setup.sh and by common.sh's
      # idp_login() for provisioning scripts). idp_login.py binds a local
      # HTTP server on this port to capture the OAuth code; it MUST NOT
      # collide with identity-service's published :8766 (which previously
      # caused "[Errno 98] Address already in use" during setup.sh when
      # identity-service was already running). 8767 is not published by any
      # container, so it is always free on the host.
      - http://127.0.0.1:8767/oauth/callback
      # OpenFGA RBAC visualizer (openfga_visualized/app.py) — its own SSO
      # login on port 5050. Multiple host spellings so the flow works however
      # the dashboard is reached.
      - http://localhost:5050/callback
      - http://127.0.0.1:5050/callback
      - http://cwcloudweave.xyz:5050/callback

  - id: libcloud-portal
    name: libcloud Role Portal
    secret: 34mvbAqPZe0e7XOO3Q9QXkb1tbVamSMzEDZdX_YwKMM
    redirectURIs:
      - http://cwcloudweave.xyz:3000/auth/callback
      - http://localhost:3000/auth/callback


connectors:
  - type: ldap
    id: lldap
    name: LLDAP
    config:
      # LLDAP on the shared libcloud_net network.
      host: lldap:3890
      insecureNoSSL: true
      # Service account bind for user lookups (admin).
      bindDN: uid=admin,ou=people,dc=libcloud,dc=local
      bindPW: 0OMzVB1LsQoIbYHGNFQL
      userSearch:
        baseDN: ou=people,dc=libcloud,dc=local
        filter: "(objectClass=person)"
        # The user types their uid (e.g. "cloud-admin") at the Dex login form.
        username: uid
        # idAttr becomes the OIDC `sub`; keep it = uid so principals stay stable.
        idAttr: uid
        emailAttr: mail
        nameAttr: cn

