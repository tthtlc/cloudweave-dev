<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="monospace, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrGy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HTTP Communication Flow &#8212; libcloud REST Cluster</text>
  <text x="700" y="56" text-anchor="middle" font-size="12" fill="#64748b">Client &#183; LLDAP &#183; Dex OIDC &#183; libcloud REST Gateway &#183; OpenFGA ReBAC &#183; HashiCorp Vault &#183; AWS / Nutanix</text>

  <!-- ============================================================ -->
  <!-- CLUSTER BOUNDARY (dashed rounded rect, like EKS Cluster)     -->
  <!-- ============================================================ -->
  <rect x="250" y="170" width="900" height="690" rx="26" ry="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <rect x="270" y="156" width="230" height="28" rx="6" fill="#0f172a"/>
  <text x="385" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">libcloud REST Cluster</text>

  <!-- ============================================================ -->
  <!-- EXTERNAL COMPONENTS                                          -->
  <!-- ============================================================ -->

  <!-- Client (left, outside) -->
  <rect x="40" y="440" width="150" height="96" rx="10" fill="#1e293b" stroke="#0f172a"/>
  <text x="115" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Client</text>
  <text x="115" y="492" text-anchor="middle" font-size="9" fill="#cbd5e1">idp_login.py</text>
  <text x="115" y="506" text-anchor="middle" font-size="9" fill="#cbd5e1">cloud-*.sh scripts</text>
  <text x="115" y="522" text-anchor="middle" font-size="9" fill="#cbd5e1">Bearer JWT</text>

  <!-- LLDAP (top center, outside &#8212; like Google Workspace) -->
  <rect x="610" y="80" width="180" height="78" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
  <text x="700" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">LLDAP</text>
  <text x="700" y="128" text-anchor="middle" font-size="9" fill="#e9d5ff">:3890  User Directory</text>
  <text x="700" y="144" text-anchor="middle" font-size="9" fill="#e9d5ff">LDAP bind + group search</text>

  <!-- Cloud Provider (right, outside) -->
  <rect x="1210" y="440" width="160" height="96" rx="10" fill="#64748b" stroke="#475569"/>
  <text x="1290" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Cloud Provider</text>
  <text x="1290" y="492" text-anchor="middle" font-size="9" fill="#e2e8f0">AWS EC2</text>
  <text x="1290" y="506" text-anchor="middle" font-size="9" fill="#e2e8f0">Nutanix Prism</text>
  <text x="1290" y="522" text-anchor="middle" font-size="9" fill="#e2e8f0">RunInstances / vms</text>

  <!-- ============================================================ -->
  <!-- INTERNAL CLUSTER COMPONENTS                                  -->
  <!-- ============================================================ -->

  <!-- Dex (upper-left inside cluster) -->
  <rect x="300" y="250" width="170" height="86" rx="10" fill="#2563eb" stroke="#1d4ed8"/>
  <text x="385" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Dex</text>
  <text x="385" y="300" text-anchor="middle" font-size="9" fill="#dbeafe">:5556  OIDC Issuer</text>
  <text x="385" y="316" text-anchor="middle" font-size="9" fill="#dbeafe">/dex/auth &#183; /dex/token</text>
  <text x="385" y="330" text-anchor="middle" font-size="9" fill="#dbeafe">/dex/keys (JWKS, RS256)</text>

  <!-- libcloud REST (center inside cluster &#8212; like Kubernetes API Server) -->
  <rect x="610" y="440" width="200" height="100" rx="10" fill="#059669" stroke="#047857"/>
  <text x="710" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">libcloud REST</text>
  <text x="710" y="490" text-anchor="middle" font-size="9" fill="#d1fae5">:8765  FastAPI Gateway</text>
  <text x="710" y="506" text-anchor="middle" font-size="9" fill="#d1fae5">JWT validate &#183; scope gate</text>
  <text x="710" y="522" text-anchor="middle" font-size="9" fill="#d1fae5">principal_map &#183; policies.json</text>

  <!-- OpenFGA (upper-right inside cluster &#8212; like RBAC) -->
  <rect x="940" y="250" width="180" height="86" rx="10" fill="#9333ea" stroke="#7e22ce"/>
  <text x="1030" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">OpenFGA</text>
  <text x="1030" y="300" text-anchor="middle" font-size="9" fill="#f3e8ff">:8080  ReBAC Engine</text>
  <text x="1030" y="316" text-anchor="middle" font-size="9" fill="#f3e8ff">POST /stores/{id}/check</text>
  <text x="1030" y="330" text-anchor="middle" font-size="9" fill="#f3e8ff">user?role?tenant?provider</text>

  <!-- Vault (lower-center inside cluster) -->
  <rect x="610" y="740" width="200" height="86" rx="10" fill="#f59e0b" stroke="#d97706"/>
  <text x="710" y="770" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Vault</text>
  <text x="710" y="790" text-anchor="middle" font-size="9" fill="#fef3c7">:8200  Secrets KV v2</text>
  <text x="710" y="806" text-anchor="middle" font-size="9" fill="#fef3c7">/secret/data/libcloud/{binding}</text>
  <text x="710" y="820" text-anchor="middle" font-size="9" fill="#fef3c7">X-Vault-Token</text>

  <!-- ============================================================ -->
  <!-- NUMBERED HTTP PACKET TRACE                                   -->
  <!-- ============================================================ -->

  <!-- 1a. Client ? Dex : OIDC auth request -->
  <line x1="190" y1="470" x2="298" y2="288" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="258" y="362" font-size="10" font-weight="bold" fill="#dc2626">1a.</text>
  <text x="258" y="376" font-size="9" fill="#dc2626">OIDC auth request</text>
  <text x="258" y="388" font-size="8" fill="#991b1b">GET /dex/auth?client_id=libcloud-rest</text>

  <!-- 1b. Dex ? LLDAP : LDAP bind -->
  <line x1="385" y1="250" x2="690" y2="160" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="470" y="196" font-size="10" font-weight="bold" fill="#dc2626">1b.</text>
  <text x="470" y="210" font-size="9" fill="#dc2626">LDAP simple bind (uid+password)</text>
  <text x="470" y="222" font-size="8" fill="#991b1b">+ group / custom-attr search</text>

  <!-- 1c. LLDAP ? Dex : bind OK + groups -->
  <line x1="700" y1="160" x2="452" y2="250" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="560" y="246" font-size="9" fill="#dc2626">1c. bind OK + groups returned</text>

  <!-- 1d. Dex ? Client : signed JWT -->
  <line x1="300" y1="312" x2="192" y2="500" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="150" y="404" font-size="10" font-weight="bold" fill="#dc2626">1d.</text>
  <text x="150" y="418" font-size="9" fill="#dc2626">200 &#8212; signed JWT</text>
  <text x="150" y="430" font-size="8" fill="#991b1b">{id,access,refresh} RS256</text>

  <!-- 2. Client ? libcloud REST : pass identity (JWT) -->
  <line x1="190" y1="498" x2="608" y2="498" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="400" y="492" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">2. Pass IdP identity (JWT)</text>
  <text x="400" y="514" text-anchor="middle" font-size="8" fill="#1d4ed8">Authorization: Bearer &lt;jwt&gt;  on  POST /v1/compute/nodes  (or other /v1/* route)</text>

  <!-- 3. libcloud REST ? Dex : JWT validation (JWKS fetch) -->
  <line x1="630" y1="440" x2="455" y2="336" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrB)"/>
  <text x="476" y="392" font-size="10" font-weight="bold" fill="#2563eb">3.</text>
  <text x="476" y="406" font-size="9" fill="#2563eb">JWT validation</text>
  <text x="476" y="418" font-size="8" fill="#1d4ed8">GET /dex/keys (JWKS) ? verify</text>
  <text x="476" y="430" font-size="8" fill="#1d4ed8">RS256 &#183; iss &#183; aud &#183; exp</text>
  <line x1="470" y1="336" x2="612" y2="438" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrB)"/>
  <text x="552" y="376" font-size="8" fill="#1d4ed8">JWKS keys</text>

  <!-- 4. libcloud REST ? OpenFGA : authorize (forward same JWT) -->
  <line x1="810" y1="456" x2="942" y2="300" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrP)"/>
  <text x="866" y="362" font-size="10" font-weight="bold" fill="#9333ea">4.</text>
  <text x="866" y="376" font-size="9" fill="#9333ea">Authorize with OpenFGA</text>
  <text x="866" y="388" font-size="8" fill="#7e22ce">POST /stores/{id}/check</text>
  <text x="866" y="400" font-size="8" fill="#7e22ce">(forwards same Dex JWT)</text>

  <!-- 4 return: OpenFGA ? libcloud REST -->
  <line x1="940" y1="336" x2="812" y2="478" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrP)"/>
  <text x="870" y="438" font-size="8" fill="#7e22ce">{ allowed: true } | 403 denied</text>

  <!-- 3b. OpenFGA ? Dex : independent JWT validation (side note) -->
  <line x1="940" y1="282" x2="470" y2="282" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrP)"/>
  <text x="705" y="276" text-anchor="middle" font-size="8" fill="#7e22ce" font-style="italic">3b. OpenFGA independently validates the forwarded JWT against Dex JWKS</text>

  <!-- 5. libcloud REST ? Vault : fetch cloud credentials -->
  <line x1="690" y1="540" x2="690" y2="738" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text x="540" y="612" font-size="10" font-weight="bold" fill="#16a34a">5.</text>
  <text x="540" y="626" font-size="9" fill="#16a34a">Fetch cloud credentials</text>
  <text x="540" y="638" font-size="8" fill="#166534">GET /secret/data/libcloud/{binding}</text>
  <text x="540" y="650" font-size="8" fill="#166534">X-Vault-Token &#183; cached 30s</text>

  <!-- 5 return: Vault ? libcloud REST -->
  <line x1="730" y1="738" x2="730" y2="542" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrG)"/>
  <text x="744" y="640" font-size="8" fill="#166534">200 &#8212; cloud creds</text>
  <text x="744" y="652" font-size="8" fill="#166534">(key/secret/region/host)</text>

  <!-- 6. libcloud REST ? Cloud Provider : cloud action -->
  <line x1="810" y1="486" x2="1208" y2="486" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrGy)"/>
  <text x="1010" y="478" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">6. Cloud action</text>
  <text x="1010" y="500" text-anchor="middle" font-size="8" fill="#475569">AWS: POST ec2.&lt;region&gt;.amazonaws.com Action=RunInstances  |  Nutanix: POST /api/vmm/v4.0/ahv/config/vms</text>

  <!-- 6 return: Cloud Provider ? libcloud REST -->
  <line x1="1208" y1="512" x2="812" y2="512" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrGy)"/>
  <text x="1010" y="528" text-anchor="middle" font-size="8" fill="#475569">200 &#8212; instance / task-id / resource data</text>

  <!-- 7. libcloud REST ? Client : final result -->
  <line x1="610" y1="524" x2="192" y2="524" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrB)"/>
  <text x="400" y="546" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">7. Action allowed / denied</text>
  <text x="400" y="560" text-anchor="middle" font-size="8" fill="#1d4ed8">200 { data, meta: { request_id } }  |  401/403/503 short-circuit at first failing gate</text>

  <!-- ============================================================ -->
  <!-- LEGEND                                                       -->
  <!-- ============================================================ -->
  <rect x="40" y="890" width="1320" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="910" font-size="10" font-weight="bold" fill="#475569">TRACE LEGEND  (follow the numbered packets):</text>
  <line x1="56" y1="924" x2="86" y2="924" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrR)"/>
  <text x="92" y="928" font-size="9" fill="#dc2626">1 OIDC login (Client?Dex?LLDAP?JWT)</text>
  <line x1="330" y1="924" x2="360" y2="924" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="366" y="928" font-size="9" fill="#2563eb">2 pass JWT &#183; 3 JWT validate &#183; 7 result</text>
  <line x1="640" y1="924" x2="670" y2="924" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrP)"/>
  <text x="676" y="928" font-size="9" fill="#9333ea">4 OpenFGA ReBAC authorization</text>
  <line x1="940" y1="924" x2="970" y2="924" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrG)"/>
  <text x="976" y="928" font-size="9" fill="#16a34a">5 Vault cloud credentials</text>
  <line x1="1180" y1="924" x2="1210" y2="924" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrGy)"/>
  <text x="1216" y="928" font-size="9" fill="#6b7280">6 Cloud API call</text>
  <text x="56" y="948" font-size="8" fill="#94a3b8" font-style="italic">Solid = request packet &#183; dashed = response / internal side-effect (JWKS fetch). Each JWT is validated twice (libcloud REST + OpenFGA) against the same Dex JWKS. Gate order: JWT ? scope ? provider ? OpenFGA ? Vault ? cloud.</text>
</svg>
