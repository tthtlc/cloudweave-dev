services:
  # Stoplight Prism: OpenAPI schema-valid mock server
  prism:
    image: stoplight/prism:5
    command: "mock -h 0.0.0.0 -p 4010 -m false /spec/openapi.json"
    volumes:
      - ./spec:/spec:ro
    ports:
      - "127.0.0.1:4010:4010"
    restart: unless-stopped

  # Stateful Node.js shim: VM CRUD + task polling
  emulator:
    build: ./mock
    ports:
      - "0.0.0.0:9440:9440"
    environment:
      - PRISM_URL=http://prism:4010
    depends_on:
      - prism
    restart: unless-stopped
