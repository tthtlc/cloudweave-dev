name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks also flags secrets in old commits (the
          # committed vault/generated/vault.env will appear here until the
          # history purge is done — that red is the correct signal).
          fetch-depth: 0

      - name: Gitleaks scan (default rules catch hvs./hvr./s. Vault tokens)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard generated env files (path + value check)
        run: bash scripts/git-secrets-check.sh
