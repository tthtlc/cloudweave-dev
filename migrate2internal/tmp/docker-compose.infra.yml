# Mock cloud infrastructure — SSH bastion + private droplet.
#
# These containers simulate a DigitalOcean-style cloud environment:
#   bastion          — jump host, exposes SSH on host port 2222
#   private-droplet  — internal-only VM, reachable through the bastion
#
# The images are externally built (no Dockerfile in this project) and were
# saved by backup-system.sh into the stack-images.tar archive.  They are
# loaded into Docker by restore-system.sh before this compose file runs.
#
# Networks digitaloceancloud_public and digitaloceancloud_private are
# created by restore-system.sh (Step 6).  The bastion bridges both networks
# so it can forward SSH connections to the private droplet.

services:
  bastion:
    image: digitaloceancloud-bastion:latest
    container_name: bastion
    command: ["/usr/sbin/sshd", "-D", "-e"]
    restart: unless-stopped
    networks:
      - digitaloceancloud_public
      - digitaloceancloud_private
    ports:
      - "2222:22"

  private-droplet:
    image: digitaloceancloud-private-droplet:latest
    container_name: private-droplet
    command: ["/usr/sbin/sshd", "-D", "-e"]
    restart: unless-stopped
    networks:
      - digitaloceancloud_private

networks:
  digitaloceancloud_public:
    external: true
  digitaloceancloud_private:
    external: true
