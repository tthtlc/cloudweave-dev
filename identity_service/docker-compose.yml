# Portal identity service — backend for ../server (the role portal).
#
# Serves the /api/* contract documented in ../server/README.md by orchestrating
# Dex (token exchange), LLDAP (user directory), OpenFGA (authorization), and
# the libcloud REST API (cloud resources/provisioning).
#
# env_file pulls SECRETS + ids from the sibling stacks; `environment:` overrides
# the host-side URLs in those files with in-container forms (dex:5556, openfga:8080,
# lldap, libcloud-rest-api:8765) since `environment:` takes precedence over
# `env_file` in compose.
services:
  identity-service:
    build: .
    image: libcloud-identity-service:latest
    container_name: identity-service
    restart: unless-stopped
    networks:
      - libcloud_net
    ports:
      - "${IDENTITY_HTTP_PORT:-8766}:8766"
    env_file:
      # DEX_PORTAL_CLIENT_SECRET, DEX_PORTAL_REDIRECT_URI, DEX_GOOGLE/GITHUB_CLIENT_ID
      - ../dex/generated/dex.env
      # FGA_STORE_ID, FGA_MODEL_ID
      - ../openfga_postgres/generated/fga.env
      # LLDAP_LDAP_USER_PASS, LLDAP_LDAP_BASE_DN, LLDAP_ADMIN_USER
      - ../lldap/.env
    environment:
      # Override host-side URLs from the env_files with in-container forms.
      # NOTE: DEX_BASE_URL stays browser-facing (public hostname) because the
      # identity service returns it to the browser as the authorize URL.
      # DEX_ISSUER is also the PUBLIC URL — it must match the `iss` claim Dex
      # puts in ID tokens (Dex's issuer is now public so federated connector
      # callbacks {issuer}/callback are browser-reachable). DEX_TOKEN_URL and
      # DEX_JWKS_URL stay in-container (dex:5556) for fast server-to-server
      # token exchange and JWKS fetch; the key is identical regardless of
      # which URL fetched it.
      DEX_BASE_URL: http://login.quest4science.xyz:5556/dex
      DEX_TOKEN_URL: http://dex:5556/dex/token
      DEX_JWKS_URL: http://dex:5556/dex/keys
      DEX_ISSUER: http://login.quest4science.xyz:5556/dex
      DEX_PORTAL_CLIENT_ID: libcloud-portal
      FGA_ENABLED: "true"
      FGA_API_URL: http://openfga:8080
      LLDAP_HOST: lldap
      LLDAP_PORT: "3890"
      LLDAP_USE_SSL: "false"
      LLDAP_BASE_DN: ou=people,dc=libcloud,dc=local
      LIBCLOUD_REST_URL: http://libcloud-rest-api:8765
      DEX_URL: http://dex:5556
      LIBCLOUD_OIDC_CLIENT_ID: libcloud-rest
      LIBCLOUD_OIDC_REDIRECT_URI: http://127.0.0.1:8766/oauth/callback
      # Provisioner service-account login (libcloud-rest-audience token). The
      # identity service performs a Dex LDAP login as the per-cloud admin to
      # obtain the token it forwards to the libcloud REST API for both provision
      # and deprovision. Provide these via the host environment or a .env file
      # next to docker-compose.yml; defaults to the dev password when
      # ALLOW_DEV_DEFAULTS=1 is set in common.sh on the host side.
      LIBCLOUD_USER_AWS_ADMIN: ${LIBCLOUD_USER_AWS_ADMIN:-aws-admin}
      LIBCLOUD_PASSWORD_AWS_ADMIN: ${LIBCLOUD_PASSWORD_AWS_ADMIN:-}
      LIBCLOUD_USER_NTNX_ADMIN: ${LIBCLOUD_USER_NTNX_ADMIN:-ntnx-admin}
      LIBCLOUD_PASSWORD_NTNX_ADMIN: ${LIBCLOUD_PASSWORD_NTNX_ADMIN:-}
      AWS_REGION: ap-southeast-1
      NUTANIX_HOST: host.docker.internal
      NUTANIX_PORT: "9440"
      NUTANIX_API_VERSION: v4.0
      # Generate with: python3 -c 'import secrets;print(secrets.token_urlsafe(48))'
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      SESSION_SECURE: "false"
      SESSION_SAMESITE: lax
      # Deprovisioning shells out to test_script/scripts/deprovision_aws.sh.
      # The repo's scripts dir is mounted at /opt/libcloud-scripts/scripts (see
      # volumes below) so the script + common.sh are available without baking
      # the whole repo into the image. REPO_ROOT inside the script then resolves
      # to /opt, which has no .env/dex.env/fga.env, so the env vars passed by the
      # identity service (DEX_URL, FGA_*, LIBCLOUD_REST_URL, ...) are the ones
      # common.sh actually uses.
      DEPROVISION_AWS_SCRIPT: /opt/libcloud-scripts/scripts/deprovision_aws.sh
    volumes:
      # Only the scripts the identity service shells out to (deprovision_aws.sh
      # + common.sh). Read-only: the service never writes here.
      - ../test_script/scripts:/opt/libcloud-scripts/scripts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  libcloud_net:
    external: true
