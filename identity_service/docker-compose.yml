# Portal identity service — backend for ../server (the role portal).
#
# Serves the /api/* contract documented in ../server/README.md by orchestrating
# Dex (token exchange), LLDAP (user directory), OpenFGA (authorization), and
# the libcloud REST API (cloud resources/provisioning).
#
# env_file pulls SECRETS + ids from the sibling stacks; `environment:` overrides
# the host-side URLs in those files with in-container forms (dex:5556, openfga:8080,
# lldap, libcloud-rest-api:8765) since `environment:` takes precedence over
# `env_file` in compose.
services:
  identity-service:
    build: .
    image: libcloud-identity-service:latest
    container_name: identity-service
    restart: unless-stopped
    networks:
      - libcloud_net
    ports:
      - "127.0.0.1:${IDENTITY_HTTP_PORT:-8766}:8766"
    env_file:
      # DEX_PORTAL_CLIENT_SECRET, DEX_PORTAL_REDIRECT_URI, DEX_GOOGLE/GITHUB_CLIENT_ID
      - ../dex/generated/dex.env
      # FGA_STORE_ID, FGA_MODEL_ID
      - ../openfga_postgres/generated/fga.env
      # LLDAP_LDAP_USER_PASS, LLDAP_LDAP_BASE_DN, LLDAP_ADMIN_USER
      - ../lldap/.env
      # VAULT_DEPT_ORCHESTRATOR_TOKEN (identity-service's scoped Vault capability
      # for creating per-department AppRoles + writing/viewing dept credentials).
      - ../vault/generated/vault.env
      # Per-tenant provisioner passwords (LIBCLOUD_PASSWORD_AWS1_ADMIN /
      # AWS2_ADMIN) written by create_tenant.sh / register_aws_tenants.sh. The
      # identity service logs in as a tenant's admin to obtain the libcloud-rest
      # token it forwards, so it needs these to provision/deprovision on behalf
      # of aws1-admin / aws2-admin. Optional: a fresh setup with no extra tenants
      # has no file here.
      - path: ../test_script/generated/dex.env
        required: false
    environment:
      # Override host-side URLs from the env_files with in-container forms.
      # NOTE: DEX_BASE_URL stays browser-facing (public hostname) because the
      # identity service returns it to the browser as the authorize URL.
      # DEX_ISSUER is also the PUBLIC URL — it must match the `iss` claim Dex
      # puts in ID tokens (Dex's issuer is now public so federated connector
      # callbacks {issuer}/callback are browser-reachable). DEX_TOKEN_URL and
      # DEX_JWKS_URL stay in-container (dex:5556) for fast server-to-server
      # token exchange and JWKS fetch; the key is identical regardless of
      # which URL fetched it.
      # PUBLIC_HOSTNAME is read by config.py to derive DEX_BASE_URL (browser-facing).
      # DEX_ISSUER stays at its in-container default (http://dex:5556/dex) so all
      # Docker services can validate tokens / fetch JWKS without public DNS.
      # Change PUBLIC_HOSTNAME + DNS (or /etc/hosts) to migrate servers.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      DEX_BASE_URL: http://${PUBLIC_HOSTNAME:-localhost}:3000/dex
      DEX_TOKEN_URL: http://dex:5556/dex/token
      DEX_JWKS_URL: http://dex:5556/dex/keys
      DEX_ISSUER: http://dex:5556/dex
      DEX_PORTAL_CLIENT_ID: libcloud-portal
      FGA_ENABLED: "true"
      FGA_API_URL: http://openfga:8080
      LLDAP_HOST: lldap
      LLDAP_PORT: "3890"
      LLDAP_USE_SSL: "false"
      LLDAP_BASE_DN: ou=people,dc=libcloud,dc=local
      LIBCLOUD_REST_URL: http://libcloud-rest-api:8765
      # In-container Vault URL (overrides the host-side VAULT_ADDR in
      # ../vault/generated/vault.env).
      VAULT_ADDR: http://vault:8200
      DEX_URL: http://dex:5556
      LIBCLOUD_OIDC_CLIENT_ID: libcloud-rest
      # RUNTIME portal-login callback. The browser lands here after Dex
      # authorization; this port is published by THIS container (ports: above)
      # and served by the identity service's /oauth/callback route. This is
      # distinct from the BOOTSTRAP/host-script callback (8767) used by
      # test_script/scripts/idp_login.py — see dex/config.template.yaml. Do
      # NOT change this to 8767; 8766 is the runtime portal callback.
      LIBCLOUD_OIDC_REDIRECT_URI: http://127.0.0.1:8766/oauth/callback
      # Provisioner service-account login (libcloud-rest-audience token). The
      # identity service performs a Dex LDAP login as the per-cloud admin to
      # obtain the token it forwards to the libcloud REST API for both provision
      # and deprovision, AND to authorize OpenFGA /check calls (OpenFGA validates
      # the Dex JWT via JWKS). The LIBCLOUD_USER_*_ADMIN and
      # LIBCLOUD_PASSWORD_*_ADMIN values come from ../dex/generated/dex.env
      # (loaded above via env_file) — do NOT redeclare them here with ${VAR:-}
      # substitution, because docker compose resolves ${VAR:-} from the host env
      # / compose-dir .env (which don't carry them) and `environment:` would
      # then override the real dex.env values with empty strings.
      AWS_REGION: ap-southeast-1
      # Nutanix provider — set in root .env; defaults target the Docker host.
      # NUTANIX_* are live-reloaded from ../my.env (mounted below) via
      # hot_config.py; these environment lines are only the fallback.
      HOT_CONFIG_PATH: /run/config/my.env
      NUTANIX_HOST: ${NUTANIX_HOST:-host.docker.internal}
      NUTANIX_PORT: ${NUTANIX_PORT:-9440}
      NUTANIX_API_VERSION: ${NUTANIX_API_VERSION:-v4.0}
      NUTANIX_VERIFY_SSL: ${NUTANIX_VERIFY_SSL:-false}
      # Generate with: python3 -c 'import secrets;print(secrets.token_urlsafe(48))'
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      SESSION_SECURE: "false"
      SESSION_SAMESITE: lax
      # Deprovisioning shells out to test_script/scripts/deprovision_<cloud>.sh.
      # The repo's scripts dir is mounted at /opt/libcloud-scripts/scripts (see
      # volumes below) so the script + common.sh are available without baking
      # the whole repo into the image. REPO_ROOT inside the script then resolves
      # to /opt, which has no .env/dex.env/fga.env, so the env vars passed by the
      # identity service (DEX_URL, FGA_*, LIBCLOUD_REST_URL, ...) are the ones
      # common.sh actually uses. Both clouds share one code path in the proxy;
      # only the script path + a few cloud-specific env vars differ.
      DEPROVISION_AWS_SCRIPT: /opt/libcloud-scripts/scripts/deprovision_aws.sh
      DEPROVISION_NTNX_SCRIPT: /opt/libcloud-scripts/scripts/deprovision_nutanix.sh
      # The "Provision Private VM Machine" button shells out to these scripts
      # (bastion + internal pair, nutanix_bastion_internal_server.md /
      # aws_bastion_internal_server.md) from the same read-only scripts mount.
      PROVISION_PRIVATE_NTNX_SCRIPT: /opt/libcloud-scripts/scripts/provision_nutanix_bastion_private.sh
      PROVISION_PRIVATE_AWS_SCRIPT: /opt/libcloud-scripts/scripts/provision_aws_private.sh
    volumes:
      # Live-reload config (NUTANIX_* + PUBLIC_HOSTNAME) — read at request time
      # by app/hot_config.py so edits to ../my.env need no container restart.
      - ../my.env:/run/config/my.env:ro
      # Only the scripts the identity service shells out to (deprovision_aws.sh
      # + common.sh). Read-only: the service never writes here.
      - ../test_script/scripts:/opt/libcloud-scripts/scripts:ro
      # REST API authorization policies (read-only, for superadmin explorer).
      - ../libcloud.rest/app/auth/policies.json:/opt/policies.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8766/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  libcloud_net:
    external: true
