# Sample docker-compose for running the portal + a Dex instance configured for
# Google + GitHub federation. This is a starter; the real identity service
# backend is expected to exist separately and implement the /api/* contract.
#
# Runtime layout mirrors the rest of the stack (./dex, ./vault,
# ./openfga_postgres, etc.). See system_design/ARCHITECTURE.md.

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: dex
    restart: unless-stopped
    networks:
      - libcloud_net
    ports:
      - "${DEX_HTTP_PORT:-5556}:5556"
    volumes:
      - ./dex/config.sample.yaml:/etc/dex/config.yaml:ro
    # TODO: render config.sample.yaml with real secrets before mounting.
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-",
             "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal
    restart: unless-stopped
    depends_on:
      - dex
    networks:
      - libcloud_net
    ports:
      - "${PORTAL_HTTP_PORT:-3000}:3000"
    environment:
      REACT_APP_DEX_BASE_URL: http://localhost:5556/dex   # TODO: in-cluster use http://dex:5556/dex
      REACT_APP_DEX_CLIENT_ID: libcloud-portal
      REACT_APP_DEX_REDIRECT_URI: http://localhost:3000/auth/callback
      REACT_APP_API_BASE_URL: http://localhost:8766       # TODO: identity service URL
      REACT_APP_MOCK_MODE: "true"                          # set "false" once backend is live

networks:
  libcloud_net:
    external: true
