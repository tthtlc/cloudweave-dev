# Portal frontend (React/nginx) — depends on the standalone Dex instance
# (../dex/docker-compose.yml) for OIDC authentication. The identity service
# backend (../identity_service) must also be running.
#
# Runtime layout mirrors the rest of the stack (./dex, ./vault,
# ./openfga_postgres, etc.). See system_design/ARCHITECTURE.md.

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      # CRA bakes REACT_APP_* into the static bundle at BUILD time, so these
      # must be passed as build args (not just runtime environment). All
      # browser-facing URLs derive from PUBLIC_HOSTNAME (set in server/.env).
      # Override individual REACT_APP_* vars for non-standard setups.
      args:
        REACT_APP_DEX_BASE_URL: ${REACT_APP_DEX_BASE_URL:-http://${PUBLIC_HOSTNAME:-localhost}:3000/dex}
        REACT_APP_DEX_CLIENT_ID: ${REACT_APP_DEX_CLIENT_ID:-libcloud-portal}
        REACT_APP_DEX_REDIRECT_URI: ${REACT_APP_DEX_REDIRECT_URI:-http://${PUBLIC_HOSTNAME:-localhost}:3000/auth/callback}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
        REACT_APP_MOCK_MODE: ${REACT_APP_MOCK_MODE:-false}
        REACT_APP_DISABLE_FEDERATION: ${REACT_APP_DISABLE_FEDERATION:-true}
    container_name: portal
    restart: unless-stopped
    networks:
      - libcloud_net
    ports:
      - "${PORTAL_HTTP_PORT:-3000}:3000"
    # nginx serves a pre-built static bundle, so these runtime env vars have no
    # effect on the served app; kept only for operator introspection.
    environment:
      REACT_APP_DEX_BASE_URL: ${REACT_APP_DEX_BASE_URL:-http://${PUBLIC_HOSTNAME:-localhost}:3000/dex}
      REACT_APP_DEX_CLIENT_ID: ${REACT_APP_DEX_CLIENT_ID:-libcloud-portal}
      REACT_APP_DEX_REDIRECT_URI: ${REACT_APP_DEX_REDIRECT_URI:-http://${PUBLIC_HOSTNAME:-localhost}:3000/auth/callback}
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
      REACT_APP_MOCK_MODE: ${REACT_APP_MOCK_MODE:-false}
      REACT_APP_DISABLE_FEDERATION: ${REACT_APP_DISABLE_FEDERATION:-true}

networks:
  libcloud_net:
    external: true
